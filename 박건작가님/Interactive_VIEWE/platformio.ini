; =====================================================================
; [머신아트랩 - 박건 작가님] VIEWE UEDX80480043E-WB-A/B 통합 펌웨어
;  - 4.3" 800x480 RGB (온보드) + 2.8" ST7789 (SPI) + MAX7219 8자리 + HX711
; =====================================================================
[platformio]
default_envs = viewe43
; 프로젝트 경로에 한글이 있으면 링커가 map 파일을 못 만들어 실패하므로 빌드 폴더만 영문 경로로 분리
build_dir = ${sysenv.USERPROFILE}/.pio-build/Interactive_VIEWE

[env:viewe43]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1 N16R8 : 16MB Flash, 8MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    bogde/HX711 @ ^0.7.5

build_flags =
    -D CORE_DEBUG_LEVEL=2
    -D BOARD_HAS_PSRAM
    ; 업로드/시리얼은 CH340(UART0, GPIO43/44) 사용. 네이티브 USB CDC는 끔
    -D ARDUINO_USB_CDC_ON_BOOT=0
